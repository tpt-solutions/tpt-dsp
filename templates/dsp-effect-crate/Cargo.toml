[package]
name = "{{crate_name}}"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A real-time-safe DSP effect built on tpt-dsp."
publish = false

[dependencies]
# Keep default-features off unless you need std conveniences; the core crate is no_std.
# Intentionally unused by the skeleton itself: it is here so generated crates can
# start importing `tpt_dsp_core` immediately. cargo-machete is told to skip it.
tpt-dsp-core = { version = "0.1", path = "../../tpt-dsp-core" }

[package.metadata.cargo-machete]
ignored = ["tpt-dsp-core"]
