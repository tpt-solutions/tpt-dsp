[package]
name = "tpt-dsp-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Spectrum analysis, time-series statistics and feature extraction for tpt-dsp."
keywords = ["dsp", "signal-analysis", "spectrum", "fft", "statistics"]
categories = ["science", "multimedia::audio", "algorithms"]
readme = "README.md"

[features]
default = ["async"]
async = ["async-tokio"]
async-tokio = ["dep:tokio", "dep:futures"]
async-std = ["dep:async-std", "dep:futures"]

[dependencies]
tpt-dsp-core = { path = "../tpt-dsp-core", version = "0.1.0" }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
async-std = { workspace = true, optional = true }

[dev-dependencies]
