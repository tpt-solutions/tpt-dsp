[package]
name = "tpt-dsp-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure Rust hardware I/O: audio (in-tree WASAPI/ALSA/CoreAudio), WAV, serial and streaming for tpt-dsp."
keywords = ["dsp", "audio", "serial", "sdr", "hardware-io"]
categories = ["hardware-support", "multimedia::audio", "embedded"]
readme = "README.md"

[features]
default = []
audio = []
serial = ["dep:serialport"]
tcp = ["dep:tokio"]
# Selects the RTL-SDR hardware backend. No driver crate can currently be
# depended on without breaking the default build, so this only changes the
# error `RtlSdrSource` reports; see its documentation.
rtl-sdr = []

[dependencies]
tpt-dsp-core = { path = "../tpt-dsp-core", version = "0.1.0" }
serialport = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tpt-dsp-core = { path = "../tpt-dsp-core", version = "0.1.0" }
