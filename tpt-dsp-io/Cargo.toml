[package]
name = "tpt-dsp-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure Rust hardware I/O: audio (cpal), serial and streaming for tpt-dsp."
keywords.workspace = true
categories.workspace = true

[features]
default = []
audio = ["dep:cpal"]
serial = ["dep:serialport"]
tcp = ["dep:tokio"]
# Selects the RTL-SDR hardware backend. No driver crate can currently be
# depended on without breaking the default build, so this only changes the
# error `RtlSdrSource` reports; see its documentation.
rtl-sdr = []

[dependencies]
tpt-dsp-core = { path = "../tpt-dsp-core", version = "0.1.0" }
cpal = { workspace = true, optional = true }
serialport = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tpt-dsp-core = { path = "../tpt-dsp-core", version = "0.1.0" }
