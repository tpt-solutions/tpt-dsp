[package]
name = "tpt-dsp-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.tpt-dsp-core]
path = ".."
features = ["alloc"]

[[bin]]
name = "iir_designs"
path = "fuzz_targets/iir_designs.rs"
test = false
doc = false
bench = false

# Standalone workspace: the fuzz harness is not a member of the main workspace.
[workspace]
