[package]
name = "tpt-dsp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure math, FFT, filters and zero-allocation buffers for tpt-dsp. Fully no_std compatible."
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = [
    "alloc",
    "num-complex/std",
    "num-traits/std",
    "dep:rustfft",
    "dep:crossbeam-channel",
]
alloc = []

[dependencies]
# `libm` is enabled unconditionally so that `num_traits::Float` (sin/cos/sqrt/
# atan2) and `Complex::{norm,arg}` exist on bare-metal targets that have no
# `std`. When the `std` feature is on, num-traits prefers the std intrinsics
# and the libm code is not used.
num-complex = { workspace = true, features = ["libm"] }
num-traits = { workspace = true, features = ["libm"] }
rustfft = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.5"
rubato = "1.0.1"

[[bench]]
name = "dsp_bench"
harness = false

