[package]
name = "tpt-dsp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure math, FFT, filters and zero-allocation buffers for tpt-dsp. Fully no_std compatible."
keywords = ["dsp", "signal-processing", "fft", "filters", "no-std"]
categories = ["multimedia::audio", "science", "no-std"]
readme = "README.md"

[features]
default = ["std"]
std = [
    "alloc",
    "num-complex/std",
    "num-traits/std",
    "dep:rustfft",
    "dep:crossbeam-channel",
]
alloc = []
# Nightly-only: enables the `core::simd` (portable SIMD) accelerated paths in
# `crate::simd`. Requires a nightly compiler because `portable_simd` is an
# unstable language feature. With this off (the default) the same functions are
# provided by a portable scalar fallback that builds on stable.
simd = []

[dependencies]
# `libm` is enabled unconditionally so that `num_traits::Float` (sin/cos/sqrt/
# atan2) and `Complex::{norm,arg}` exist on bare-metal targets that have no
# `std`. When the `std` feature is on, num-traits prefers the std intrinsics
# and the libm code is not used.
num-complex = { workspace = true, features = ["libm"] }
num-traits = { workspace = true, features = ["libm"] }
rustfft = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }

[dev-dependencies]
# `rubato` (MIT) and its buffer-adapter crate are benchmark-only reference
# implementations for the sample-rate-conversion comparison in
# `benches/resampling_bench.rs`. They are never linked into the library.
audioadapter-buffers = "5.2"
criterion = "0.8"
rubato = "5.0.0"

[[bench]]
name = "dsp_bench"
harness = false

[[bench]]
name = "filter_bench"
harness = false

[[bench]]
name = "resampling_bench"
harness = false

