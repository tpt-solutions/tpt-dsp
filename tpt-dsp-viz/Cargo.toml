[package]
name = "tpt-dsp-viz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Real-time waterfall spectrum and live spectrum-line desktop UI for tpt-dsp."
keywords = ["dsp", "waterfall", "spectrum", "sdr", "gui"]
categories = ["visualization", "science", "multimedia"]
readme = "README.md"

[features]
default = []
audio = ["dep:tpt-dsp-io", "tpt-dsp-io/audio"]

[dependencies]
tpt-dsp-analysis = { path = "../tpt-dsp-analysis", version = "0.2.0", default-features = false }
crossbeam-channel = { workspace = true }
minifb = "0.29"
tpt-dsp-io = { path = "../tpt-dsp-io", version = "0.2.0", optional = true }

[dev-dependencies]
png = "0.18"

[package.metadata.docs.rs]
all-features = true
