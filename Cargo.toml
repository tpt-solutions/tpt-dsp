[workspace]
resolver = "2"
members = [
    "tpt-dsp-core",
    "tpt-dsp-audio",
    "tpt-dsp-analysis",
    "tpt-dsp-control",
    "tpt-dsp-io",
    "tpt-dsp-viz",
    "tpt-dsp-wasm",
    "tpt-dsp-cli",
]

# `tpt-dsp-nihplug` (CLAP/VST3 wrapper) and `tpt-dsp-py` (Python bindings) are
# intentionally excluded from the default workspace build:
#   * `tpt-dsp-py` links Python (extension-module) and cannot be built or tested
#     by the normal `cargo build/test --workspace` gate.
#   * `tpt-dsp-nihplug` pulls the VST3/CLAP SDK bindings whose transitive
#     licenses (e.g. MIT-0) are not in the main `deny.toml` allow-list.
# Both are standalone workspaces that depend on the crates above via path
# dependencies and are verified separately (`cargo build` inside each dir).
exclude = [
    "tpt-dsp-nihplug",
    "tpt-dsp-py",
    # cargo-generate template (its Cargo.toml contains `{{crate_name}}` placeholders
    # and is only instantiated via `cargo generate --path templates/dsp-effect-crate`).
    "templates",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Whole-workspace minimum: `tpt-dsp-viz` depends on `egui`/`eframe` 0.36,
# which require Rust 1.85+. The leaf crates (core/audio/analysis/control/io)
# still build on older toolchains when compiled in isolation, but the workspace
# as a whole cannot build below 1.85.
rust-version = "1.85"
authors = ["TPT Solutions"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-dsp"
homepage = "https://github.com/tpt-solutions/tpt-dsp"
description = "A pure-Rust, real-time-safe digital signal processing framework."
keywords = ["dsp", "audio", "fft", "signal-processing", "no-std"]
categories = ["multimedia::audio", "science", "no-std"]

[workspace.dependencies]
# CLI / example tooling crates (workspace members only).
clap = { version = "4", features = ["derive"] }
hound = "3"
anyhow = "1"
# `default-features = false` is required here (not in the member manifest):
# cargo silently ignores a member-level `default-features = false` when the
# workspace dependency does not declare it. Members opt back into `std` via
# their own feature flags so `tpt-dsp-core` stays no_std-buildable.
num-complex = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
rustfft = { version = "6.2", default-features = false }
crossbeam-channel = "0.5"
cpal = "0.18"
serialport = "4.6"
tokio = { version = "1", features = ["sync", "time", "io-util", "rt", "net"] }
futures = "0.3"
async-std = { version = "1.13", features = ["default"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

[profile.release]
lto = "thin"

[workspace.metadata.docs.rs]
all-features = true
