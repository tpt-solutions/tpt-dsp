# Release checks and the GitHub Release for a version tag (`v0.3.0`).
#
# This workflow does NOT publish to crates.io. Publishing is a separate,
# one-way step (see PUBLISHING.md) and stays a manual action. What runs here:
#
#   1. verify  — the full gate (fmt, clippy, test), and a check that the tag
#                matches the workspace version.
#   2. release — creates a GitHub Release from the matching CHANGELOG.md
#                section. Runs only if `verify` passed.
#
# It runs on a pushed `v*` tag. It can also be started by hand from the Actions
# tab ("Run workflow") with an existing tag in `tag`, which is how a Release is
# created for a tag that was pushed before this workflow was fixed. The jobs then
# check out that tag, so the gate and the CHANGELOG come from the tagged commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.3.0"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Gate and version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - name: Install system libraries (libudev)
        # serialport (tpt-dsp-io's `serial` feature, on under --all-features)
        # links libudev through pkg-config; the CI workflow installs it too.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match workspace version $version" >&2
            exit 1
          fi
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-features

  release:
    name: GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - name: Extract the CHANGELOG section for this version
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" v "]")) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG.md section for $version" >&2
            exit 1
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag
