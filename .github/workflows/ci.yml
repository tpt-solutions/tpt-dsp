name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Re-run the dependency audit even when nothing is pushed, so newly
  # published RUSTSEC advisories against existing dependencies are caught.
  schedule:
    - cron: "0 3 * * 1"

# Least-privilege: the CI jobs only read the repo and never push, matching
# the pattern already used by the Pages deployment workflow.
permissions:
  contents: read

# A new push to the same branch or PR cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  native:
    name: Build / Test / Clippy (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # --all-features enables tpt-dsp-io/serial (serialport -> libudev-sys).
      # Its build script locates libudev through pkg-config, so the -dev
      # package must exist. The audio backend is in-tree and needs no system
      # library.
      - name: Install system libraries (libudev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: cargo build
        run: cargo build --workspace --all-features
      - name: cargo test
        run: cargo test --workspace --all-features
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: no_std check (core, no features)
        run: cargo build -p tpt-dsp-core --no-default-features
      - name: no_std check (core, alloc only)
        run: cargo build -p tpt-dsp-core --no-default-features --features alloc
      # Compile-only: the benches must keep building, but CI does not time them.
      - name: cargo bench (compile only)
        run: cargo bench --workspace --no-run

  wasm:
    name: Build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain + wasm target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo check core/audio for wasm
        run: cargo check -p tpt-dsp-core -p tpt-dsp-audio --target wasm32-unknown-unknown
      - name: cargo build tpt-dsp-wasm for wasm
        run: cargo build -p tpt-dsp-wasm --all-features --target wasm32-unknown-unknown

  embedded:
    name: Build (thumbv7em-none-eabihf, no_std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain + thumb target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # A real `build` (not just `check`) on a target that has no `std` at all
      # is what actually proves no_std correctness: any dependency that leaks
      # `std` fails to link here. Both feature configurations that are meant
      # to work without `std` are covered.
      - name: cargo build tpt-dsp-core (no_std, no features)
        run: cargo build -p tpt-dsp-core --target thumbv7em-none-eabihf --no-default-features
      - name: cargo build tpt-dsp-core (no_std + alloc)
        run: cargo build -p tpt-dsp-core --target thumbv7em-none-eabihf --no-default-features --features alloc
      - name: cargo clippy tpt-dsp-core (no_std)
        run: cargo clippy -p tpt-dsp-core --target thumbv7em-none-eabihf --no-default-features -- -D warnings

  deny:
    name: License / advisory audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # main
        with:
          tool: cargo-deny
      # Default feature set: what a plain `cargo add tpt-dsp-*` pulls in.
      - name: cargo-deny check (default features)
        run: cargo deny check bans licenses advisories sources
      # Every optional dependency (serialport, tokio, async-std, ...)
      # lives behind a non-default feature, so the default-feature pass above
      # never sees them. Without this second pass a GPL/LGPL dependency could
      # be added behind a feature flag and slip through the audit entirely.
      # NOTE: `--all-features` is a *global* cargo-deny flag and must appear
      # before the `check` subcommand.
      - name: cargo-deny check (all features)
        run: cargo deny --all-features check bans licenses advisories sources

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      # Broken intra-doc links and missing docs are errors, not warnings.
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Same reason as the `native` job: cargo doc runs with --all-features,
      # which pulls serialport (libudev).
      - name: Install system libraries (libudev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: cargo doc
        run: cargo doc --workspace --all-features --no-deps

  feature-matrix:
    name: Feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # main
        with:
          tool: cargo-hack
      # tpt-dsp-io's serial feature links libudev through pkg-config.
      - name: Install system libraries (libudev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # Every combination of the library crates' features must compile. This
      # is what catches a `#[cfg]` gate that only works with some features on,
      # such as the alloc-only and no-default-features paths of tpt-dsp-core.
      - name: cargo hack check (feature powerset)
        run: >
          cargo hack check --feature-powerset --no-dev-deps
          -p tpt-dsp-core -p tpt-dsp-audio -p tpt-dsp-analysis
          -p tpt-dsp-control -p tpt-dsp-io

  fuzz:
    name: Fuzz smoke test (cargo-fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # main
        with:
          tool: cargo-fuzz
      # A short run per target, to catch a regression that a unit test misses.
      # The corpus is not kept between runs, so each run starts from scratch.
      # --target is pinned to the GNU host triple: cargo-fuzz defaults to musl
      # on Linux, which is not installed here and cannot be sanitized (ASan
      # needs dynamic libc).
      - name: Fuzz the IIR designs (tpt-dsp-core)
        working-directory: tpt-dsp-core/fuzz
        run: cargo fuzz run --target x86_64-unknown-linux-gnu iir_designs -- -max_total_time=60
      - name: Fuzz the WAV reader (tpt-dsp-io)
        working-directory: tpt-dsp-io/fuzz
        run: cargo fuzz run --target x86_64-unknown-linux-gnu wav_reader -- -max_total_time=60

  coverage:
    name: Line coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # main
        with:
          tool: cargo-llvm-cov
      - name: Install system libraries (libudev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # Measured at 84% on Windows when this gate was set. The threshold sits
      # below that so Linux-only and Windows-only backends do not cause a
      # false failure. Raise it when coverage rises, rather than leaving it.
      - name: cargo llvm-cov (workspace, all features)
        run: cargo llvm-cov --workspace --all-features --summary-only --fail-under-lines 80

  bench:
    name: Benchmarks (weekly, results kept as an artifact)
    # Scheduled only: shared runners are too noisy to gate on timings. Compare
    # runs by downloading the criterion artifact, not by failing this job.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo bench (tpt-dsp-core)
        run: cargo bench -p tpt-dsp-core
      - name: Keep the criterion results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: criterion-core-${{ github.run_id }}
          path: target/criterion
          retention-days: 90

  machete:
    name: Unused dependencies (cargo-machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install cargo-machete
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # main
        with:
          tool: cargo-machete
      - name: cargo machete
        run: cargo machete

  msrv:
    name: Minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.85
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install system libraries (libudev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: cargo check (workspace, all features)
        run: cargo check --workspace --all-features

  windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The native audio backend (WASAPI) is compiled here; its runtime path
      # needs a sound device, so only the default feature set is tested.
      - name: cargo test (default features)
        run: cargo test --workspace

  macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # CoreAudio backend: compile-checked only (no sound device on runners).
      - name: cargo build (audio and io features)
        run: cargo build -p tpt-dsp-io --features audio

  nightly-simd:
    name: Test (nightly portable SIMD)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Enables the core::simd path (tpt_portable_simd cfg set by build.rs).
      - name: cargo test tpt-dsp-core with simd
        run: cargo test -p tpt-dsp-core --features simd

  excluded-crates:
    name: Build excluded wrappers (nihplug, py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # These are standalone workspaces excluded from the main build.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # NumPy is installed so the array-input tests run instead of skipping.
      - name: Build the abi3 Python wheel and run its tests (tpt-dsp-py)
        working-directory: tpt-dsp-py
        run: |
          python -m pip install maturin numpy
          maturin build --release --out dist
          python -m pip install dist/*.whl
          python -m unittest discover -s tests
      # The zero-copy build is per-version, not abi3, so it gets its own venv.
      - name: Build and test the zero-copy wheel (tpt-dsp-py)
        working-directory: tpt-dsp-py
        run: |
          maturin build --release --no-default-features --features zero-copy --out dist-zc
          python -m venv zc-venv
          zc-venv/bin/python -m pip install numpy dist-zc/*.whl
          zc-venv/bin/python -m unittest discover -s tests
      - name: cargo build tpt-dsp-nihplug
        working-directory: tpt-dsp-nihplug
        run: cargo build
