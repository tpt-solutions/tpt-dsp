[graph]
# Unconditionally block copyleft licenses. tpt-dsp is strictly dual
# MIT / Apache-2.0 and must never link against GPL/LGPL/AGPL code.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
    { triple = "thumbv7em-none-eabihf" },
]

[advisories]
yanked = "deny"
# async-std is discontinued upstream (RUSTSEC-2025-0052). It is only pulled
# in by the opt-in `async-std` feature of tpt-dsp-analysis, never by the
# default feature set, and is kept for users already on that runtime.
ignore = ["RUSTSEC-2025-0052"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    # Bundled UI fonts pulled in transitively by `egui`/`epaint` (used only by
    # the `tpt-dsp-viz` desktop example). These are permissive *font* licenses,
    # not source copyleft, so they are safe to allow alongside the code licenses.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
