[package]
name = "tpt-dsp-py"
version = "0.2.0"
edition = "2021"
authors = ["TPT Solutions"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-dsp"
homepage = "https://github.com/tpt-solutions/tpt-dsp"
description = "Python bindings for tpt-dsp (pyo3): analysis, filters and PID."
keywords = ["dsp", "python", "fft", "signal-processing"]
categories = ["science", "multimedia::audio"]

# The compiled module is `tpt_dsp._native`; the `tpt_dsp` package (python/)
# re-exports it and ships the type stub. `[lib] name` must match the
# `#[pymodule]` function name.
[lib]
name = "_native"
crate-type = ["cdylib"]

# `extension-module` links the Python C-API at load time instead of embedding
# libpython, so the module cannot be run as a normal binary or test.
[dependencies]
tpt-dsp-core = { path = "../tpt-dsp-core", version = "0.3.0" }
tpt-dsp-analysis = { path = "../tpt-dsp-analysis", version = "0.3.0" }
tpt-dsp-control = { path = "../tpt-dsp-control", version = "0.3.0" }
tpt-dsp-audio = { path = "../tpt-dsp-audio", version = "0.3.0" }
pyo3 = { version = "0.30", features = ["extension-module"] }

[features]
# The default build is one abi3 wheel for Python 3.9 and later. (pyo3 0.30
# dropped the `abi3-py38` feature.)
default = ["abi3"]
abi3 = ["pyo3/abi3-py39"]
# Zero-copy input: a NumPy float32 array is read in place. The buffer protocol
# is not part of the limited API, so this needs a per-version, non-abi3 wheel:
#   maturin build --release --no-default-features --features zero-copy
zero-copy = []

[workspace]
